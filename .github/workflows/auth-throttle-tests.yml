name: Auth throttle stress tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  auth-throttle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Provide these as GitHub Actions secrets on the repository.
      # PGHOST should point at the managed Postgres for the project's backend.
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verify DB connectivity
        run: psql -At -c "select 1" >/dev/null

      - name: Make scripts executable
        run: chmod +x scripts/test-auth-throttle-concurrency.sh scripts/test-auth-throttle-mixed.sh

      - name: Concurrency test — signin (N=20)
        run: N=20 TYPE=signin ./scripts/test-auth-throttle-concurrency.sh

      - name: Concurrency test — signin (N=50)
        run: N=50 TYPE=signin ./scripts/test-auth-throttle-concurrency.sh

      - name: Concurrency test — reset (N=20)
        run: N=20 TYPE=reset ./scripts/test-auth-throttle-concurrency.sh

      - name: Mixed-type concurrency + cross-type isolation test
        run: ./scripts/test-auth-throttle-mixed.sh
